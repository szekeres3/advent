<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blokk Robi – blokkprogramozás gyakorlása</title>
<style>
:root{--bg:#eef2fb;--card:#fff;--tx:#1f2a44;--mu:#5b6785;--ac:#4c6ef5;--bd:#d5dcf0;--path:#f3e3b3;--wall:#7bc67b;--water:#8ecbf0;--ok:#d9f5e1;--okt:#14532d;--er:#fde2e2;--ert:#7f1d1d;--wn:#fff3cd;--wnt:#664d03;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12172a;--card:#1c2340;--tx:#e8ecfa;--mu:#a3adcc;--bd:#323c63;--path:#6b5d3a;--wall:#2f6b3a;--water:#2a5f86;--ok:#14391f;--okt:#b7f0c8;--er:#4a1c1c;--ert:#fbcaca;--wn:#4a3f14;--wnt:#ffe69c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12172a;--card:#1c2340;--tx:#e8ecfa;--mu:#a3adcc;--bd:#323c63;--path:#6b5d3a;--wall:#2f6b3a;--water:#2a5f86;--ok:#14391f;--okt:#b7f0c8;--er:#4a1c1c;--ert:#fbcaca;--wn:#4a3f14;--wnt:#ffe69c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 10px}
h2{font-size:1.15rem;margin:0 0 4px}
p{margin:0;color:var(--mu)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.btn{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
#board{position:relative;display:grid;width:100%;max-width:380px;margin:12px auto;border-radius:10px;overflow:hidden}
.c{aspect-ratio:1;background:var(--path);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,30px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.c.w{background:var(--wall)}.c.wa{background:var(--water)}
#robot{position:absolute;padding:5%;pointer-events:none;transition:left .35s,top .35s}
#robot svg{display:block;width:100%;height:100%;transition:transform .3s}
#robot.bump{animation:sh .4s}
@keyframes sh{25%{translate:-5px 0}75%{translate:5px 0}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:600;background:var(--bg);color:var(--tx)}
.msg.ok{background:var(--ok);color:var(--okt)}.msg.er{background:var(--er);color:var(--ert)}.msg.wn{background:var(--wn);color:var(--wnt)}
.cnt{font-weight:600;margin-bottom:8px;color:var(--mu)}
#ws{height:min(70vh,520px);min-height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
</style>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/hu.js"></script>
</head>
<body>
<main>
<h1>🤖 Blokk Robi</h1>
<div class="tabs" id="tabs"></div>
<div class="grid">
 <section class="card">
  <h2 id="ttl"></h2><p id="task"></p>
  <div id="board"></div>
  <div class="row"><button class="btn p" id="run">▶ Futtatás</button><button class="btn" id="rst">↺ Újra</button><button class="btn p" id="nxt" hidden>Következő játék ▶</button></div>
  <div class="msg" id="msg"></div>
 </section>
 <section class="card"><div class="cnt" id="cnt"></div><div id="ws"></div></section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
if(!window.Blockly){$('msg').textContent='A Blockly nem töltődött be – ellenőrizd az internetkapcsolatot.';throw new Error('no blockly')}

// S = start, G = cél, # = fa, ~ = tó, . = út. Robi kelet felé indul.
const LV=[
{t:'1. játék – Első lépések',k:'Vezesd el Robit a csillaghoz! Húzd a blokkokat az Indítás blokk alá, a helyes sorrendben.',
 g:['S...#','###.#','###G#'],b:['forward','turn_right'],m:0},
{t:'2. játék – A lépcső',k:'Robi a lépcsőn megy fel a csillaghoz. Legfeljebb 7 blokkot használhatsz, ezért az ismétlés a barátod!',
 g:['####G','###..','##..#','#..##','S.###'],b:['forward','turn_left','turn_right','repeat'],m:7},
{t:'3. játék – Kerüld meg a tavat',k:'Robinak körbe kell mennie a tavon. Legfeljebb 7 blokk! Tipp: az ismétlésbe másik ismétlést is tehetsz.',
 g:['S.....','~~~~~.','~~~~~.','~~~~~.','~~~~~.','G.....'],b:['forward','turn_right','repeat'],m:7}];

Blockly.defineBlocksWithJsonArray([
{type:'start',message0:'▶ Indítás',nextStatement:null,colour:45},
{type:'forward',message0:'lépj előre',previousStatement:null,nextStatement:null,colour:210},
{type:'turn_left',message0:'fordulj balra ↶',previousStatement:null,nextStatement:null,colour:285},
{type:'turn_right',message0:'fordulj jobbra ↷',previousStatement:null,nextStatement:null,colour:20},
{type:'repeat',message0:'ismételd %1 alkalommal',args0:[{type:'field_number',name:'N',value:2,min:1,max:9,precision:1}],
 message1:'%1',args1:[{type:'input_statement',name:'DO'}],previousStatement:null,nextStatement:null,colour:120}]);

const SVG='<svg viewBox="0 0 40 40"><rect x="5" y="7" width="26" height="26" rx="7" fill="#4c6ef5" stroke="#1e3a8a" stroke-width="2"/><circle cx="24" cy="15" r="3.2" fill="#fff"/><circle cx="24" cy="25" r="3.2" fill="#fff"/><path d="M32 14l7 6-7 6z" fill="#f59e0b"/></svg>';
const DX=[1,0,-1,0],DY=[0,1,0,-1];
let ws,cur=0,busy=false,done=[false,false,false],W,H,sx,sy,gx,gy,x,y,ang,robot;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dir=()=>((ang/90)%4+4)%4;
const say=(t,c)=>{const m=$('msg');m.textContent=t;m.className='msg '+(c||'')};
const blocked=(a,b)=>a<0||b<0||a>=W||b>=H||'#~'.includes(LV[cur].g[b][a]);

function build(){
  const g=LV[cur].g,b=$('board');H=g.length;W=g[0].length;b.innerHTML='';
  b.style.gridTemplateColumns='repeat('+W+',1fr)';b.style.aspectRatio=W+'/'+H;
  g.forEach((row,j)=>[...row].forEach((ch,i)=>{
    const c=document.createElement('div');
    c.className='c'+(ch==='#'?' w':ch==='~'?' w wa':'');
    c.textContent=ch==='#'?'🌲':ch==='~'?'🌊':ch==='G'?'⭐':'';
    b.appendChild(c);
    if(ch==='S'){sx=i;sy=j}if(ch==='G'){gx=i;gy=j}
  }));
  robot=document.createElement('div');robot.id='robot';
  robot.style.width=100/W+'%';robot.style.height=100/H+'%';robot.innerHTML=SVG;b.appendChild(robot);
  resetRobot();
}
function draw(){robot.style.left=x*100/W+'%';robot.style.top=y*100/H+'%';robot.firstChild.style.transform='rotate('+ang+'deg)'}
function resetRobot(){x=sx;y=sy;ang=0;draw()}
function bump(){robot.classList.remove('bump');void robot.offsetWidth;robot.classList.add('bump')}
function hl(id){try{ws.highlightBlock(id)}catch(e){}}

function mount(){
  if(ws){ws.dispose();$('ws').innerHTML=''}
  const L=LV[cur];
  ws=Blockly.inject('ws',{renderer:'zelos',sounds:false,trashcan:false,collapse:false,comments:false,disable:false,
    maxBlocks:L.m?L.m+1:Infinity,move:{scrollbars:true,drag:true,wheel:false},
    toolbox:{kind:'flyoutToolbox',contents:L.b.map(type=>({kind:'block',type}))}});
  Blockly.serialization.workspaces.load({blocks:{languageVersion:0,blocks:[{type:'start',x:24,y:24,deletable:false}]}},ws);
  ws.addChangeListener(count);count();
}
function count(){const n=ws.getAllBlocks(false).length-1,m=LV[cur].m;$('cnt').textContent='Blokkok: '+n+(m?' / '+m:'')}

function flat(b,out){
  for(;b;b=b.getNextBlock()){
    if(b.type==='repeat'){
      const n=+b.getFieldValue('N')||1,inner=[];flat(b.getInputTargetBlock('DO'),inner);
      for(let i=0;i<n;i++)out.push(...inner);
    }else out.push({t:b.type,id:b.id});
  }
}

async function run(){
  if(busy)return;resetRobot();hl(null);
  const tops=ws.getTopBlocks(false);
  if(tops.length>1){say('Minden blokkot kapcsolj az ▶ Indítás blokk alá!','wn');return}
  const steps=[];flat(tops[0].getNextBlock(),steps);
  if(!steps.length){say('Még nincs program. Húzz blokkokat az ▶ Indítás blokk alá!','wn');return}
  busy=true;$('run').disabled=true;say('Robi úton van…');
  let ok=true;
  for(const s of steps){
    hl(s.id);
    if(s.t==='forward'){
      const nx=x+DX[dir()],ny=y+DY[dir()];
      if(blocked(nx,ny)){bump();ok=false;say('Jaj, Robi nekiment az akadálynak! Nézd át a blokkok sorrendjét.','er');break}
      x=nx;y=ny;
    }else ang+=s.t==='turn_left'?-90:90;
    draw();await sleep(500);
  }
  hl(null);busy=false;$('run').disabled=false;
  if(!ok)return;
  if(x===gx&&y===gy)win();else say('Robi nem ért el a csillaghoz. Nézd meg újra a blokkok sorrendjét!','er');
}
function win(){
  done[cur]=true;tabs();
  if(cur<2){say('Szuper, megoldottad! 🎉 Mehetsz a következő játékra.','ok');$('nxt').hidden=false}
  else say('Gratulálok! Mind a három játékot megoldottad! 🏆','ok');
}
function tabs(){
  const t=$('tabs');t.innerHTML='';
  LV.forEach((_,i)=>{
    const b=document.createElement('button'),open=i===0||done[i-1];
    b.className='tab'+(i===cur?' on':'');b.disabled=!open;
    b.textContent=(done[i]?'✅ ':open?'':'🔒 ')+(i+1)+'. játék';
    b.onclick=()=>{if(!busy)go(i)};t.appendChild(b);
  });
}
function go(i){
  cur=i;busy=false;$('run').disabled=false;$('nxt').hidden=true;
  $('ttl').textContent=LV[i].t;$('task').textContent=LV[i].k;
  say('Építsd meg a programot, majd nyomd meg a ▶ Futtatás gombot!');
  build();mount();tabs();
}
$('run').onclick=run;
$('rst').onclick=()=>{if(!busy){resetRobot();hl(null);say('Robi visszatért a startra.')}};
$('nxt').onclick=()=>{if(!busy&&cur<2)go(cur+1)};
new ResizeObserver(()=>ws&&Blockly.svgResize(ws)).observe($('ws'));
go(0);
</script>
</body>
</html>
